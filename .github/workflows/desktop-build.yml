name: Build desktop app

# Builds the NovaPlay desktop player for macOS, Windows and Linux.
# PyInstaller cannot cross-compile, so each OS builds its own artifact on a
# matching runner. Triggered manually, or on a version tag (v*) to also
# attach the bundles to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: NovaPlay-macos
          - os: windows-latest
            artifact: NovaPlay-windows
          - os: ubuntu-latest
            artifact: NovaPlay-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SDL needs a few system libs to import/build on a bare Linux runner.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 \
            libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0 libfreetype6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller desktop/NovaPlay.spec --noconfirm

      # Verify the FROZEN build actually loads a game (read_text+exec path).
      # Run via subprocess so the windowed (console=False) exit code is
      # captured reliably on every OS, even where stdout is detached.
      - name: Selftest the frozen build
        shell: python
        run: |
          import subprocess, sys, os
          if sys.platform == "darwin":
              exe = "dist/NovaPlay.app/Contents/MacOS/NovaPlay"
          elif os.name == "nt":
              exe = r"dist\NovaPlay\NovaPlay.exe"
          else:
              exe = "dist/NovaPlay/NovaPlay"
          r = subprocess.run([exe, "--selftest"], capture_output=True, text=True)
          print("stdout:", r.stdout)
          print("stderr:", r.stderr)
          sys.exit(r.returncode)

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -ry ../${{ matrix.artifact }}.zip NovaPlay.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/NovaPlay/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist NovaPlay

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

      # On a version tag, attach the bundles to the GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
